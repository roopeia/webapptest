<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flask Starter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #172033;
      background: #f3f6fb;
    }
    main {
      width: min(100%, 560px);
      padding: 40px;
      border: 1px solid #e1e7f0;
      border-radius: 18px;
      background: white;
      box-shadow: 0 16px 45px rgba(25, 40, 70, .08);
    }
    h1 { margin-top: 0; }
    p { line-height: 1.6; color: #526078; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      color: white;
      background: #315be8;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #2448c5; }
    #response { margin-top: 18px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Your Flask app is running 🎉</h1>
    <p>This page is served by Flask from the <code>frontend</code> folder.</p>
    <button id="api-button" type="button">Test backend API</button>
    <p id="response" aria-live="polite">Click the button to call <code>/api/hello</code>.</p>
  </main>
  <script src="/static/api.js" defer></script>
</body>
</html>
